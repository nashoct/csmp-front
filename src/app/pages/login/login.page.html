<ion-content [fullscreen]="true" class="login-content">
  <div class="login-shell">
    <form class="login-card" (ngSubmit)="onLogin()">
      <header class="login-card__header">
        <div class="login-card__brand">
          <span class="material-symbols-rounded">dashboard</span>
          <span>CSMP</span>
        </div>
        <p class="login-card__eyebrow">Bienvenido</p>
        <h2>Iniciar sesión</h2>
        <p class="login-card__subtitle">Introduce tus credenciales para acceder a la plataforma.</p>
      </header>

      <label class="field">
        <span>Correo electrónico</span>
        <div class="field__control">
          <span class="material-symbols-rounded field__icon">mail</span>
          <input
            class="field__input"
            type="email"
            name="email"
            [(ngModel)]="user.email"
            autocomplete="username"
            placeholder="example@example.com"
            required
          />
        </div>
      </label>

      <label class="field">
        <span>Contraseña</span>
        <div class="field__control">
          <span class="material-symbols-rounded field__icon">lock</span>
          <input
            class="field__input"
            [type]="showPassword ? 'text' : 'password'"
            name="password"
            [(ngModel)]="user.password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          />
          <button
            class="field__toggle"
            type="button"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <span class="material-symbols-rounded">
              {{ showPassword ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </label>

      <div class="login-card__meta">
        <label class="remember">
          <input type="checkbox" name="remember-me" />
          <span>Recordar mi usuario</span>
        </label>

        <a routerLink="/register">¿No tienes cuenta?</a>
      </div>

      <button class="login-submit" type="submit">Ingresar</button>
    </form>
  </div>
</ion-content>
